app = "amocrm-readonly-mcp"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  AMO_BASE_URL = "https://mozhemevent.amocrm.ru"
  TUNNEL_ID = "tunnel_6af6e9f4e1e88191b9e234a1e28cb526"
  HEALTH_PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
